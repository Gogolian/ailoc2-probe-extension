name: Build IntelliJ Plugin

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "IntelliJ/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/intellij-plugin.yml"
  pull_request:
    paths:
      - "IntelliJ/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/intellij-plugin.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build universal plugin ZIP
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: IntelliJ

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install root dependencies
        run: npm ci
        working-directory: .

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test, build, and verify IntelliJ plugin
        run: ./gradlew test buildPlugin verifyPlugin --no-daemon --stacktrace

      - name: Prepare Marketplace artifact
        shell: bash
        run: |
          artifact_dir="build/marketplace-artifact/universal"
          rm -rf "$artifact_dir"
          mkdir -p "$artifact_dir"
          distribution_dir="$PWD/build/distributions"
          mapfile -t plugin_zips < <(find "$distribution_dir" -maxdepth 1 -type f -name '*.zip')
          test "${#plugin_zips[@]}" -eq 1 || { echo "Error: expected exactly one plugin ZIP in ${distribution_dir}, found ${#plugin_zips[@]}"; exit 1; }
          unzip -q "${plugin_zips[0]}" -d "$artifact_dir"

      - name: Upload IntelliJ plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: ailoc2-intellij-plugin-2025.2-2026.2-1.0.19
          path: IntelliJ/build/marketplace-artifact/universal/*
          if-no-files-found: error
