name: Build VS Code Extension

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".vscodeignore"
      - ".github/workflows/vscode-extension.yml"
  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".vscodeignore"
      - ".github/workflows/vscode-extension.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build VSIX
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Package VS Code extension
        run: npx --yes @vscode/vsce package --out ailoc2-vscode-extension.vsix

      - name: Upload VS Code extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: ailoc2-vscode-extension
          path: ailoc2-vscode-extension.vsix
          if-no-files-found: error
